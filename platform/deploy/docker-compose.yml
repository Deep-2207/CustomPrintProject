# One small server: the app, PostgreSQL, and Caddy (which gets a free HTTPS certificate by itself).
# Copy .env.example to .env, fill it in, then:   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: customizer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: customizer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customizer -d customizer"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://customizer:${DB_PASSWORD}@db:5432/customizer
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      GST_PERCENT: ${GST_PERCENT:-18}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
    volumes:
      - appdata:/data
    # No "ports": the app is reachable only through Caddy, so nobody can fake the client address header.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
