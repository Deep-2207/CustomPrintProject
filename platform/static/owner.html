<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner | PreviewPrint</title>
<link rel="stylesheet" href="/css/dashboard.css">
<style>.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.scroll{overflow-x:auto}</style>
</head><body>
<div class="wrap">
  <div class="bar"><div><h1>Platform owner</h1><span class="muted" id="who"></span></div><div class="row"><a class="btn ghost sm" href="/admin.html">Legacy admin</a><button class="btn ghost sm" id="logout" type="button">Log out</button></div></div>
  <section class="card"><h2>Sellers</h2>
    <div class="filters" role="group" aria-label="Filter sellers"><button data-f="pending" class="on">Waiting for approval</button><button data-f="active">Active</button><button data-f="suspended">Suspended</button><button data-f="">All</button></div>
    <div class="errs" id="err" role="alert" hidden></div>
    <div class="scroll"><table class="t" id="tenants"></table></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2>Plans and invoices</h2>
    <div class="row"><label for="bm" style="margin:0">Month</label><select id="bm" style="width:auto"></select><a class="btn sm" id="csv" href="#">Download invoices (CSV)</a></div></div>
    <p class="muted" style="margin-top:0">Active shops only. Charged: the monthly fee, designs above the included number, and the setup fee until it is marked paid. Amounts are in rupees; GST is added.</p>
    <div class="errs" id="berr" role="alert" hidden></div>
    <div class="scroll"><table class="t" id="billing"></table></div></section>
  <section class="card"><h2>Landing-page sign-ups</h2><div class="scroll"><table class="t" id="leads"></table></div></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/js/owner.js"></script>
</body></html>
