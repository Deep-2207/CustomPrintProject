<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customize Your Product</title>
<link rel="stylesheet" href="css/app.css">
</head><body>
<main class="wrap">
  <h1 id="title">Loading…</h1>
  <div class="grid">
    <section class="left">
      <div class="stage" id="stage"></div>
      <div class="views"><button data-view="front" class="btn ghost">Front</button><button data-view="back" class="btn ghost">Back</button>
        <span class="hint">Drag to rotate · scroll or pinch to zoom</span></div>
      <h3>Position text <small>(drag it)</small></h3>
      <div id="strips"></div>
    </section>
    <section class="right">
      <div id="panel"></div>
      <div id="errs" role="alert" class="errs"></div>
      <div class="actions">
        <button class="btn" id="add">Add to cart</button>
        <button class="btn ghost" id="reset">Reset Design</button>
      </div>
      <h3>Cart</h3><ul id="cart" class="cart"></ul>
    </section>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body></html>
